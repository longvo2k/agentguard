name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Lint
        run: make lint
      - name: Unit tests
        run: go test -short ./...
      - name: Shellcheck install.sh
        run: shellcheck -s sh install.sh
      - name: Build the sandbox image
        run: make image
      - name: All tests, including real containers
        env:
          AGENTGUARD_TEST_IMAGE: agentguard-sandbox:local
        run: go test -count=1 ./...
      - name: Demo self-test
        run: go run ./cmd/agentguard demo --image agentguard-sandbox:local
      - name: Check release configuration
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
